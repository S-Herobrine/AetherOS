<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Liquid Gradient for Left Wing (Cyan to Electric Violet) -->
    <linearGradient id="multiGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5FF"/>
      <stop offset="60%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>

    <!-- Liquid Gradient for Right Wing (Neon Magenta to Deep Indigo) -->
    <linearGradient id="multiGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F43F5E"/>
      <stop offset="50%" stop-color="#D946EF"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>

    <!-- Specular Highlight for Glass Sheen -->
    <linearGradient id="glassSheen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.85"/>
      <stop offset="40%" stop-color="#FFFFFF" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <!-- Ambient Glow & Bloom -->
    <filter id="multiBloom" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="14" result="blur1" />
      <feGaussianBlur stdDeviation="28" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Deep Obsidian Glass Card Container -->
  <rect x="32" y="32" width="448" height="448" rx="108" fill="#0C0A14" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>
  
  <!-- Ambient Inner Fluid Reflection Glow -->
  <circle cx="256" cy="256" r="160" fill="url(#multiGrad1)" opacity="0.15" filter="blur(36px)"/>

  <!-- Multiplex Interlocking "M" Prism Architecture -->
  <g filter="url(#cardShadow)">
    <!-- Left Multiplex Channel Column -->
    <path d="M 124 376 L 124 160 C 124 136, 154 122, 172 138 L 256 216 L 340 138 C 358 122, 388 136, 388 160 L 388 376" 
          fill="none" 
          stroke="url(#multiGrad1)" 
          stroke-width="40" 
          stroke-linecap="round" 
          stroke-linejoin="round"
          filter="url(#multiBloom)"/>

    <!-- Intersecting Multiplex Fold Channel (Layer Convergence) -->
    <path d="M 172 376 L 256 296 L 340 376" 
          fill="none" 
          stroke="url(#multiGrad2)" 
          stroke-width="36" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>

    <!-- Glass Refractive Center Prism Diamond (The Multiplex Core) -->
    <polygon points="256,160 292,204 256,248 220,204" 
             fill="url(#multiGrad2)" 
             filter="url(#multiBloom)"
             opacity="0.9"/>

    <!-- Specular Reflection Highlight Across the Core -->
    <polygon points="256,160 292,204 256,248 220,204" 
             fill="url(#glassSheen)"/>

    <!-- Top Left Glass Sheen Streak -->
    <path d="M 134 166 L 172 138 L 220 182" 
          fill="none" 
          stroke="url(#glassSheen)" 
          stroke-width="10" 
          stroke-linecap="round"
          opacity="0.75"/>
  </g>

  <!-- Multiplex Node Dots (Signaling Linux + Android + Windows) -->
  <circle cx="124" cy="376" r="12" fill="#00F5FF" filter="url(#multiBloom)"/>
  <circle cx="124" cy="376" r="5" fill="#FFFFFF"/>

  <circle cx="256" cy="296" r="12" fill="#D946EF" filter="url(#multiBloom)"/>
  <circle cx="256" cy="296" r="5" fill="#FFFFFF"/>

  <circle cx="388" cy="376" r="12" fill="#F43F5E" filter="url(#multiBloom)"/>
  <circle cx="388" cy="376" r="5" fill="#FFFFFF"/>
</svg>
