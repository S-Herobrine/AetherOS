<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="markFlow1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5FF"/>
      <stop offset="45%" stop-color="#7B2CBF"/>
      <stop offset="100%" stop-color="#F72585"/>
    </linearGradient>

    <linearGradient id="markFlow2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4CC9F0"/>
      <stop offset="50%" stop-color="#7209B7"/>
      <stop offset="100%" stop-color="#3A0CA3"/>
    </linearGradient>

    <linearGradient id="markGleam" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="35%" stop-color="#FFFFFF" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <filter id="markBloom" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Flowing Ribbon Outer Arc -->
  <path d="M 330 140 C 410 140, 430 230, 370 280 C 320 320, 240 320, 190 370 C 140 420, 190 450, 250 440 C 320 430, 360 380, 360 380" 
        fill="none" 
        stroke="url(#markFlow1)" 
        stroke-width="46" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#markBloom)"/>

  <!-- Flowing Ribbon Counter Arc -->
  <path d="M 182 372 C 102 372, 82 282, 142 232 C 192 192, 272 192, 322 142 C 372 92, 322 62, 262 72 C 192 82, 152 132, 152 132" 
        fill="none" 
        stroke="url(#markFlow2)" 
        stroke-width="46" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>

  <!-- Specular Glass Highlight -->
  <path d="M 270 78 C 310 74, 345 96, 320 135 C 285 170, 220 195, 175 220" 
        fill="none" 
        stroke="url(#markGleam)" 
        stroke-width="12" 
        stroke-linecap="round"/>

  <!-- Central Glass Nucleus -->
  <circle cx="256" cy="256" r="32" fill="url(#markFlow1)" filter="url(#markBloom)"/>
  <circle cx="256" cy="256" r="32" fill="url(#markGleam)"/>

  <!-- Dynamic Active Terminal Pulse -->
  <circle cx="360" cy="380" r="14" fill="#00F5FF" filter="url(#markBloom)"/>
  <circle cx="360" cy="380" r="6" fill="#FFFFFF"/>
</svg>
