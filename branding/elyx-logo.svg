<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Liquid Gradient 1: Cyan to Electric Violet -->
    <linearGradient id="elyxFlow1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5FF" stop-opacity="0.95"/>
      <stop offset="45%" stop-color="#7B2CBF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#F72585" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Liquid Gradient 2: Reverse Accent Flow -->
    <linearGradient id="elyxFlow2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4CC9F0" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#7209B7" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#3A0CA3" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Specular Highlight for Glass Refraction -->
    <linearGradient id="specularGleam" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.75"/>
      <stop offset="35%" stop-color="#FFFFFF" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <!-- Ambient Glow Filter -->
    <filter id="elyxBloom" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur1" />
      <feGaussianBlur stdDeviation="32" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Subtle Drop Shadow -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Dark Frosted Canvas Base -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="#0D0B14" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>
  
  <!-- Subtle Internal Radial Depth Glow -->
  <circle cx="256" cy="256" r="180" fill="url(#elyxFlow1)" opacity="0.12" filter="blur(40px)"/>

  <!-- Main Floating Liquid Ribbon Body (Continuous Infinity 'E' Helix) -->
  <g filter="url(#softShadow)">
    <!-- Primary Sweeping Outer Loop -->
    <path d="M 330 140 
             C 410 140, 430 230, 370 280 
             C 320 320, 240 320, 190 370 
             C 140 420, 190 450, 250 440 
             C 320 430, 360 380, 360 380" 
          fill="none" 
          stroke="url(#elyxFlow1)" 
          stroke-width="44" 
          stroke-linecap="round" 
          stroke-linejoin="round"
          filter="url(#elyxBloom)"/>

    <!-- Complementary Inner Intersecting Helix Arch -->
    <path d="M 182 372 
             C 102 372, 82 282, 142 232 
             C 192 192, 272 192, 322 142 
             C 372 92, 322 62, 262 72 
             C 192 82, 152 132, 152 132" 
          fill="none" 
          stroke="url(#elyxFlow2)" 
          stroke-width="44" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>

    <!-- Center Floating Refractive Glass Core Node -->
    <circle cx="256" cy="256" r="32" fill="url(#elyxFlow1)" filter="url(#elyxBloom)"/>
    <circle cx="256" cy="256" r="32" fill="url(#specularGleam)"/>

    <!-- Upper Specular Highlight Streak for Physical Glass Sheen -->
    <path d="M 270 78 C 310 74, 345 96, 320 135 C 285 170, 220 195, 175 220" 
          fill="none" 
          stroke="url(#specularGleam)" 
          stroke-width="12" 
          stroke-linecap="round" 
          opacity="0.8"/>
  </g>

  <!-- Accent Status Light Node -->
  <circle cx="360" cy="380" r="14" fill="#00F5FF" filter="url(#elyxBloom)"/>
  <circle cx="360" cy="380" r="7" fill="#FFFFFF"/>
</svg>
