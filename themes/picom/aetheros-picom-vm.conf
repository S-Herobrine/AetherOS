# ==============================================================================
# AetherOS Ultra-Fast VM / Low-End Compositor Config (Picom)
# 60fps snappy rounded corners & smooth fade animations with zero CPU blur lag
# ==============================================================================

shadow = false;

# Snappy Smooth Fading Animations
fading = true;
fade-in-step = 0.08;
fade-out-step = 0.08;
fade-delta = 4;

# Transparency / Opacity
inactive-opacity = 0.96;
active-opacity = 1.0;

# Rounded Corners (Modern Windows 11 / AetherOS Look)
corner-radius = 14;
rounded-corners-exclude = [
  "window_type = 'desktop'",
  "class_g = 'Tint2'"
];

# Disable software pixel blur so VMs & 128MB PCs stay 60fps fast
blur-background = false;

backend = "xrender";
vsync = false;
mark-wmwin-focused = true;
mark-ovredir-focused = true;
detect-rounded-corners = true;
detect-client-opacity = true;
use-damage = true;
