# ==============================================================================
# AetherOS Liquid Glass Compositor Config (Picom)
# Rounded corners, frosted glass blur, soft ambient shadows, 60fps smooth fades
# ==============================================================================

# Shadows
shadow = true;
shadow-radius = 18;
shadow-opacity = 0.55;
shadow-offset-x = -14;
shadow-offset-y = -14;
shadow-exclude = [
  "class_g = 'Tint2'",
  "_GTK_FRAME_EXTENTS@:c"
];

# Smooth Fading Animations
fading = true;
fade-in-step = 0.04;
fade-out-step = 0.04;
fade-delta = 5;

# Transparency / Opacity
inactive-opacity = 0.94;
frame-opacity = 0.92;
active-opacity = 1.0;

# Rounded Corners (Modern Liquid Glass Windows)
corner-radius = 14;
rounded-corners-exclude = [
  "window_type = 'desktop'",
  "class_g = 'Tint2'"
];

# Frosted Glass Blur (Safe across VMs & Real GPUs)
blur-background = true;
blur-method = "kernel";
blur-strength = 5;
blur-background-exclude = [
  "window_type = 'desktop'",
  "_GTK_FRAME_EXTENTS@:c"
];

# Backend & VSync (Fallback-safe for QEMU/VirtIO & Real Hardware)
vsync = true;
mark-wmwin-focused = true;
mark-ovredir-focused = true;
detect-rounded-corners = true;
detect-client-opacity = true;
use-damage = true;
