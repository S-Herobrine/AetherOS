name: Build AetherOS ISO

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-aetheros:
    name: Build AetherOS Unified Edition (128MB RAM / 1GB Storage Minimum)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Free Runner Disk Space
        run: |
          echo "Freeing runner storage..."
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/powershell
          df -h

      - name: Install ISO Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            live-build debootstrap xorriso squashfs-tools \
            mtools dosfstools grub-pc-bin grub-efi-amd64-bin \
            isolinux syslinux-utils zram-tools zstd

      - name: Build Unified AetherOS ISO (~20 mins)
        run: |
          sed -i 's/\r$//' build/*.sh scripts/*.sh 2>/dev/null || true
          chmod +x build/*.sh scripts/*.sh 2>/dev/null || true
          sudo bash build/build-iso-standard.sh

      - name: Upload AetherOS ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AetherOS-1.0-Standard-amd64-iso
          path: build/output/*.iso
          retention-days: 14
